name: Learning GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Files in repository:"
          ls -la

      - name: Show current directory
        run: pwd

      - name: Show Git commit
        run: git log -1 --oneline